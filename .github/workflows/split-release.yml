name: Split & Release Downstream

on:
  push:
    tags:
      - "python-v*"
      - "arduino-v*"
      - "esp-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test or release (e.g. v1.2.1, v1.3.0, python-v1.3.0)"
        required: true
        type: string
      dry_run:
        description: "Dry-run mode (bundle and slice subtree, but DO NOT push to downstream repositories)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================================
  # PRE-FLIGHT VALIDATION (Tag & Manifest Consistency Check)
  # ==========================================================
  preflight-validation:
    name: Pre-Flight Release Validation
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      semver: ${{ steps.validate.outputs.semver }}
      target: ${{ steps.validate.outputs.target }}
      is_python: ${{ steps.validate.outputs.is_python }}
      is_arduino: ${{ steps.validate.outputs.is_arduino }}
      is_esp32: ${{ steps.validate.outputs.is_esp32 }}
      is_dry_run: ${{ steps.dry_run.outputs.is_dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Dry-Run Mode
        id: dry_run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "is_dry_run=true" >> "$GITHUB_OUTPUT"
            echo "[USMP] Simulation mode enabled: Dry-run active. Downstream pushes will be skipped."
          else
            echo "is_dry_run=false" >> "$GITHUB_OUTPUT"
            echo "[USMP] Live release mode enabled: Downstream pushes will be executed."
          fi

      - name: Validate Tag & Manifests
        id: validate
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python3 scripts/validate-release-tag.py

  # ==========================================================
  # PYTHON SPLIT & RELEASE (Pure Subtree)
  # ==========================================================
  release-python:
    name: Release Python
    needs: [preflight-validation]
    if: needs.preflight-validation.outputs.is_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Split and Push to usmp-python
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          TARGET_TAG: ${{ needs.preflight-validation.outputs.tag }}
          IS_DRY_RUN: ${{ needs.preflight-validation.outputs.is_dry_run }}
        run: |
          SPLIT_SHA=$(git subtree split --prefix=sdk/python)
          echo "[USMP] Subtree split generated SHA: $SPLIT_SHA"

          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "[DRY-RUN] Verified python subtree split ($TARGET_TAG) at commit $SPLIT_SHA."
            echo "[DRY-RUN] Skipped git push to https://github.com/metaloomlabs/usmp-python.git"
          else
            git config --local --unset-all "http.https://github.com/.extraheader" || true
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            AUTH_HEADER=$(python3 -c 'import base64, os; print("AUTHORIZATION: basic " + base64.b64encode(f"x-access-token:{os.environ[\"SPLIT_TOKEN\"]}".encode()).decode())')
            git config --local http.https://github.com/.extraheader "$AUTH_HEADER"
            git remote add dest "https://github.com/metaloomlabs/usmp-python.git"

            git push dest "$SPLIT_SHA:refs/heads/main" --force
            git push dest "$SPLIT_SHA:refs/tags/$TARGET_TAG" --force

            git config --local --unset-all "http.https://github.com/.extraheader" || true
          fi

  # ==========================================================
  # ARDUINO SPLIT & RELEASE (Transient Bundling + Subtree)
  # ==========================================================
  release-arduino:
    name: Release Arduino
    needs: [preflight-validation]
    if: needs.preflight-validation.outputs.is_arduino == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bundle Core and Commit Ephemeral Release
        env:
          TARGET_TAG: ${{ needs.preflight-validation.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b release-temp-arduino
          python scripts/bundle-ports.py --target arduino
          git add ports/usmp-arduino
          git commit -m "chore(release): bundle core protocol engine for $TARGET_TAG"

      - name: Split and Push to usmp-arduino
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          TARGET_TAG: ${{ needs.preflight-validation.outputs.tag }}
          IS_DRY_RUN: ${{ needs.preflight-validation.outputs.is_dry_run }}
        run: |
          SPLIT_SHA=$(git subtree split --prefix=ports/usmp-arduino)
          echo "[USMP] Subtree split generated SHA: $SPLIT_SHA"

          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "[DRY-RUN] Verified arduino bundling and subtree split ($TARGET_TAG) at commit $SPLIT_SHA."
            echo "[DRY-RUN] Skipped git push to https://github.com/metaloomlabs/usmp-arduino.git"
          else
            git config --local --unset-all "http.https://github.com/.extraheader" || true
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            AUTH_HEADER=$(python3 -c 'import base64, os; print("AUTHORIZATION: basic " + base64.b64encode(f"x-access-token:{os.environ[\"SPLIT_TOKEN\"]}".encode()).decode())')
            git config --local http.https://github.com/.extraheader "$AUTH_HEADER"
            git remote add dest "https://github.com/metaloomlabs/usmp-arduino.git"

            git push dest "$SPLIT_SHA:refs/heads/main" --force
            git push dest "$SPLIT_SHA:refs/tags/$TARGET_TAG" --force

            git config --local --unset-all "http.https://github.com/.extraheader" || true
          fi

  # ==========================================================
  # ESP32 SPLIT & RELEASE (Transient Bundling + Subtree)
  # ==========================================================
  release-esp32:
    name: Release ESP32
    needs: [preflight-validation]
    if: needs.preflight-validation.outputs.is_esp32 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bundle Core and Commit Ephemeral Release
        env:
          TARGET_TAG: ${{ needs.preflight-validation.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b release-temp-esp32
          python scripts/bundle-ports.py --target esp32
          git add ports/usmp-esp32
          git commit -m "chore(release): bundle core protocol engine for $TARGET_TAG"

      - name: Split and Push to usmp-esp32
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          TARGET_TAG: ${{ needs.preflight-validation.outputs.tag }}
          IS_DRY_RUN: ${{ needs.preflight-validation.outputs.is_dry_run }}
        run: |
          SPLIT_SHA=$(git subtree split --prefix=ports/usmp-esp32)
          echo "[USMP] Subtree split generated SHA: $SPLIT_SHA"

          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "[DRY-RUN] Verified esp32 bundling and subtree split ($TARGET_TAG) at commit $SPLIT_SHA."
            echo "[DRY-RUN] Skipped git push to https://github.com/metaloomlabs/usmp-esp32.git"
          else
            git config --local --unset-all "http.https://github.com/.extraheader" || true
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            AUTH_HEADER=$(python3 -c 'import base64, os; print("AUTHORIZATION: basic " + base64.b64encode(f"x-access-token:{os.environ[\"SPLIT_TOKEN\"]}".encode()).decode())')
            git config --local http.https://github.com/.extraheader "$AUTH_HEADER"
            git remote add dest "https://github.com/metaloomlabs/usmp-esp32.git"

            git push dest "$SPLIT_SHA:refs/heads/main" --force
            git push dest "$SPLIT_SHA:refs/tags/$TARGET_TAG" --force

            git config --local --unset-all "http.https://github.com/.extraheader" || true
          fi

