name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci-checks:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca # v5.2.1
        with:
          version: "0.5.21"
          enable-cache: true

      - name: Install mbedtls and compile C core
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev
          cmake -B build -S .
          cmake --build build

      - name: Run C Core unit tests
        run: |
          ./build/usmp_tests

      - name: Install dependencies and run tests
        run: |
          cd sdk/python
          uv run pytest tests/ -v

      - name: Run Ruff Linter
        run: |
          cd sdk/python
          uv run ruff check .

      - name: Run Mypy Type Checker
        run: |
          cd sdk/python
          uv run mypy src/

      - name: Run Bandit Security Scanner
        run: |
          cd sdk/python
          uv run --with bandit bandit -r src/ -s B101,B104,B110

      - name: Run pip-audit Dependency Vulnerability Scanner
        run: |
          cd sdk/python
          uv run --with pip-audit pip-audit

  arduino-esp32-compile:
    name: Arduino ESP32 Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install zip utility
        run: sudo apt-get update && sudo apt-get install -y zip

      # Assemble the Arduino library exactly as it ships (vendors core/ into a
      # flat src/), then unpack it so we compile the real published artifact.
      - name: Assemble Arduino library
        run: |
          chmod +x scripts/build-arduino-zip.sh
          ./scripts/build-arduino-zip.sh
          unzip -q usmp-*-arduino.zip -d assembled

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$PWD/bin" sh -s 1.1.1
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core
        run: |
          arduino-cli config init --additional-urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install assembled USMP library
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          cp -r assembled/usmp-arduino "$HOME/Arduino/libraries/USMP"

      - name: Compile examples for ESP32
        run: |
          for ex in ports/usmp-arduino/examples/*/*.ino; do
            echo "::group::Compiling $ex"
            arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all \
              --libraries "$HOME/Arduino/libraries" "$(dirname "$ex")"
            echo "::endgroup::"
          done
