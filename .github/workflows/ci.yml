name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-python:
    name: Test Python SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install mbedtls and compile C core
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev
          cmake -B build -S .
          cmake --build build

      - name: Run C Core unit tests
        run: |
          ./build/usmp_tests

      - name: Install dependencies and run tests
        run: |
          cd sdk/python
          uv run pytest tests/ -v


      - name: Run Ruff Linter
        run: |
          cd sdk/python
          uv run ruff check .

      - name: Run Mypy Type Checker
        run: |
          cd sdk/python
          uv run mypy src/
