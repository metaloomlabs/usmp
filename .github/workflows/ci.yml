name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-python:
    name: Test Python SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@f67e2a3f2bd08a159500ad6f1938502cd8340487 # v5.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@887bf08e7612117b4d00f0422e1a3c7c2514c2b1 # v5.2.1
        with:
          version: "0.5.21"
          enable-cache: true

      - name: Install mbedtls and compile C core
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev
          cmake -B build -S .
          cmake --build build

      - name: Run C Core unit tests
        run: |
          ./build/usmp_tests

      - name: Install dependencies and run tests
        run: |
          cd sdk/python
          uv run pytest tests/ -v


      - name: Run Ruff Linter
        run: |
          cd sdk/python
          uv run ruff check .

      - name: Run Mypy Type Checker
        run: |
          cd sdk/python
          uv run mypy src/

      - name: Run Bandit Security Scanner
        run: |
          cd sdk/python
          uv run --with bandit bandit -r src/ -s B101,B104,B110

      - name: Run pip-audit Dependency Vulnerability Scanner
        run: |
          cd sdk/python
          uv run --with pip-audit pip-audit
