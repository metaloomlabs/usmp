name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build & Release usmp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca # v5.2.1
        with:
          version: "0.5.21"
          enable-cache: true

      - name: Run Python SDK tests
        run: |
          cd sdk/python
          uv run pytest tests/ -v

      - name: Build Python packages (sdist & wheel)
        run: |
          cd sdk/python
          uv build --out-dir ../../dist

      - name: Install zip utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build Arduino ZIP
        run: |
          chmod +x scripts/build-arduino-zip.sh
          ./scripts/build-arduino-zip.sh

      - name: Bundle core into ESP32 component
        run: |
          chmod +x scripts/build-esp32-component.sh
          ./scripts/build-esp32-component.sh --in-place

      - name: Create GitHub Release
        uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8bb048 # v2.2.0
        with:
          files: |
            usmp-*-arduino.zip
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Python package to PyPI
        run: |
          if [ -n "${{ secrets.PYPI_TOKEN }}" ]; then
            uv publish --token "${{ secrets.PYPI_TOKEN }}" dist/*
          else
            uv publish dist/*
          fi

      - name: Publish ESP32 component to ESP Component Registry
        env:
          IDF_COMPONENT_API_TOKEN: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
        if: ${{ env.IDF_COMPONENT_API_TOKEN != '' }}
        uses: espressif/upload-components-ci-action@44ae55252d675f3f7aaa25c153a6af2bb58f3fe2 # v2.0.0
        with:
          components: "usmp: ports/usmp-esp32"
          namespace: "metaloomlabs"
          api_token: ${{ env.IDF_COMPONENT_API_TOKEN }}
