name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release usmp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Run Python SDK tests
        run: |
          cd sdk/python
          uv run pytest tests/ -v

      - name: Build Python packages (sdist & wheel)
        run: |
          cd sdk/python
          uv build --out-dir ../../dist

      - name: Install zip utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build Arduino ZIP
        run: |
          chmod +x scripts/build-arduino-zip.sh
          ./scripts/build-arduino-zip.sh

      - name: Bundle core into ESP32 component
        run: |
          chmod +x scripts/build-esp32-component.sh
          ./scripts/build-esp32-component.sh --in-place

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            usmp-arduino.zip
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Python package to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        if: ${{ env.PYPI_TOKEN != '' }}
        run: |
          uv publish --token "$PYPI_TOKEN" dist/*

      - name: Publish ESP32 component to ESP Component Registry
        env:
          IDF_COMPONENT_API_TOKEN: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
        if: ${{ env.IDF_COMPONENT_API_TOKEN != '' }}
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "usmp: ports/usmp-esp32"
          namespace: "metaloomlabs"
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}