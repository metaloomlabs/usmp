name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release usmp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Run Python SDK tests
        run: |
          cd sdk/python
          uv run pytest tests/ -v

      - name: Build Python packages (sdist & wheel)
        run: |
          cd sdk/python
          uv build

      - name: Install zip utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build Arduino ZIP
        run: |
          chmod +x scripts/build-arduino-zip.sh
          ./scripts/build-arduino-zip.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            usmp-arduino.zip
            sdk/python/dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Python package to PyPI
        if: ${{ secrets.PYPI_TOKEN != '' || secrets.PYPI_API_TOKEN != '' }}
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN || secrets.PYPI_API_TOKEN }}
        run: |
          cd sdk/python
          uv publish --token "$PYPI_TOKEN"
