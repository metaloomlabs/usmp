name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-release:
    name: Build & Release usmp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.21"
          enable-cache: true

      - name: Run Python SDK tests
        run: |
          cd sdk/python
          uv run pytest tests/ -v

      - name: Build Python packages (sdist & wheel)
        run: |
          cd sdk/python
          uv build --out-dir ../../dist

      - name: Install zip utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build Arduino ZIP
        run: |
          chmod +x scripts/build-arduino-zip.sh
          ./scripts/build-arduino-zip.sh

      - name: Bundle core into ESP32 component
        run: |
          chmod +x scripts/build-esp32-component.sh
          ./scripts/build-esp32-component.sh --in-place

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            usmp-*-arduino.zip \
            dist/*.whl \
            dist/*.tar.gz \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Publish Python package to PyPI
        run: |
          if [ -n "${{ secrets.PYPI_TOKEN }}" ]; then
            uv publish --token "${{ secrets.PYPI_TOKEN }}" dist/*
          else
            uv publish dist/*
          fi

      - name: Publish ESP32 component to ESP Component Registry
        env:
          IDF_COMPONENT_API_TOKEN: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
        if: ${{ env.IDF_COMPONENT_API_TOKEN != '' }}
        uses: espressif/upload-components-ci-action@44ae55252d675f3f7aaa25c153a6af2bb58f3fe2 # v2.0.0
        with:
          components: "usmp: ports/usmp-esp32"
          namespace: "metaloomlabs"
          api_token: ${{ env.IDF_COMPONENT_API_TOKEN }}
