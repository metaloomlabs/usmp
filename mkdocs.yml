site_name: USMP - Unified Secure Multi-transport Protocol
site_description: Secure, lightweight communication protocol for embedded devices
site_author: winterx64
site_url: https://usmp.metaloom.in

repo_name: metaloomlabs/usmp
repo_url: https://github.com/metaloomlabs/usmp
edit_uri: edit/main/docs/

theme:
    name: material
    logo: assets/logo.png
    favicon: assets/favicon.png
    palette:
        - scheme: default
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-4
              name: Switch to light mode
    features:
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.sections
        - navigation.expand
        - navigation.top
        - search.highlight
        - search.suggest
        - content.code.copy
        - content.code.annotate
        - toc.follow

plugins:
    - search
    - minify:
          minify_html: true

markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - attr_list
    - md_in_html
    - tables
    - toc:
          permalink: true

nav:
    - Welcome: index.md
    - Tutorials:
          - Introduction: getting-started/what-is-usmp.md
          - Installation & Setup: getting-started/installation.md
          - 1. Your First TCP Tunnel: getting-started/tutorial-tcp.md
          - 2. Going Connectionless (UDP): getting-started/tutorial-udp.md
          - 3. Production Hardening: getting-started/production-hardening.md
    - Porting & Custom Transports:
          - ESP-IDF Port: ports/esp32.md
          - Arduino Library: ports/arduino.md
          - Porting Guide: ports/porting-guide.md
    - Python SDK Reference:
          - Overview: sdk/python.md
          - USMPServer: sdk/server.md
          - USMPClient: sdk/client.md
          - USMPSession: sdk/session.md
    - Protocol Specification:
          - Overview: protocol/overview.md
          - Wire Format: protocol/frame-format.md
          - Handshake Mechanics: protocol/handshake.md
          - Cryptographic Details: protocol/encryption.md
          - Sequence Numbers: protocol/sequence-numbers.md
          - Error Handling: protocol/error-handling.md
    - Security Model:
          - Architecture: security/model.md
          - Key Management: security/psk.md
          - Threat Analysis: security/threat-model.md
    - Tools:
          - CLI Tools (coming soon): tools/cli.md
    - Troubleshooting:
          - Diagnostic Guides: troubleshooting.md
          - Debugging & Trace: debugging.md
    - Specifications: spec.md

extra:
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/metaloomlabs/usmp

copyright: Copyright &copy; 2026 <a href="https://github.com/winterx64">Akhil B Xavier (winterx64)</a> &middot; Developed by <a href="https://github.com/metaloomlabs">Metaloom</a>
