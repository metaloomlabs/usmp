name: Verify Arduino Library

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.2.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  lint-and-release:
    name: Lint & Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Arduino Library
        uses: arduino/arduino-lint-action@v1
        with:
          compliance: specification
          library-manager: update

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: USMP Arduino Library ${{ inputs.tag_name || github.ref_name }}
          body: |
            ## USMP Arduino Library ${{ inputs.tag_name || github.ref_name }}

            This is an automated distribution release for the Arduino Library Manager.

            * 📦 **Installation**: Available in Arduino IDE Library Manager as `usmp`.
            * 📖 **Documentation & Full Changelog**: See the [Official USMP Release Notes](https://github.com/metaloomlabs/usmp/releases/tag/${{ inputs.tag_name || github.ref_name }})
            * 🛠️ **Active Development**: All development occurs in the primary monorepo at [metaloomlabs/usmp](https://github.com/metaloomlabs/usmp).
          generate_release_notes: true

