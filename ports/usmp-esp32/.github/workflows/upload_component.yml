name: Upload Component to Espressif Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.2.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  upload:
    name: Upload to Espressif Component Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload to Espressif Component Registry
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "usmp:."
          namespace: "metaloomlabs"
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: USMP ESP32 Component ${{ inputs.tag_name || github.ref_name }}
          body: |
            ## USMP ESP32 Component ${{ inputs.tag_name || github.ref_name }}

            This is an automated distribution release for the Espressif Component Registry.

            * 📦 **Registry Listing**: [components.espressif.com/components/metaloomlabs/usmp](https://components.espressif.com/components/metaloomlabs/usmp)
            * 📖 **Documentation & Full Changelog**: See the [Official USMP Release Notes](https://github.com/metaloomlabs/usmp/releases/tag/${{ inputs.tag_name || github.ref_name }})
            * 🛠️ **Active Development**: All development occurs in the primary monorepo at [metaloomlabs/usmp](https://github.com/metaloomlabs/usmp).
          generate_release_notes: true

