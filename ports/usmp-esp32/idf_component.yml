version: "1.1.0"
description: >
  USMP — Unified Secure Multi-transport Protocol. Mutually authenticated,
  AES-256-GCM encrypted sessions for ESP32 over TCP and UDP. No TLS stack required.
url: "https://usmp.metaloom.in"
repository: "https://github.com/metaloomlabs/usmp"
issues: "https://github.com/metaloomlabs/usmp/issues"
documentation: "https://usmp.metaloom.in"
license: "Apache-2.0"

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32h2

tags:
  - security
  - protocol
  - encryption
  - iot
  - networking
  - tcp
  - aes-gcm

dependencies:
  idf:
    version: ">=5.0.0"
