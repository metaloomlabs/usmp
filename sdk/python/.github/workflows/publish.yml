name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  pypi-release:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Enables OIDC Trusted Publishing
      contents: write # Enables GitHub Release creation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.21"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python SDK tests
        run: uv run pytest tests/ -v

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            echo "[USMP] Publishing using PYPI_TOKEN..."
            uv publish --token "$PYPI_TOKEN" dist/*
          else
            echo "[USMP] Publishing using OIDC Trusted Publishing..."
            uv publish dist/*
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
