name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.2.1)"
        required: false
        default: ""

jobs:
  pypi-release:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Enables OIDC Trusted Publishing
      contents: write # Enables GitHub Release creation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.21"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python SDK tests
        run: uv run pytest tests/ -v

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            echo "[USMP] Publishing using PYPI_TOKEN..."
            uv publish --token "$PYPI_TOKEN" dist/*
          else
            echo "[USMP] Publishing using OIDC Trusted Publishing..."
            uv publish dist/*
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: USMP Python SDK ${{ inputs.tag_name || github.ref_name }}
          body: |
            ## USMP Python SDK ${{ inputs.tag_name || github.ref_name }}

            This is an automated distribution release for PyPI.

            * 📦 **PyPI Package**: [`usmp`](https://pypi.org/project/usmp/)
            * 📖 **Documentation & Full Changelog**: See the [Official USMP Release Notes](https://github.com/metaloomlabs/usmp/releases/tag/${{ inputs.tag_name || github.ref_name }})
            * 🛠️ **Active Development**: All development occurs in the primary monorepo at [metaloomlabs/usmp](https://github.com/metaloomlabs/usmp).
          generate_release_notes: true

