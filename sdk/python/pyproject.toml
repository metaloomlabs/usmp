[project]
name = "usmp"
version = "1.1.0"
description = "USMP - Unified Secure Multi-transport Protocol. Secure, encrypted device communication for ESP32, Arduino and IoT."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "winterx64", email = "winterx64.work@gmail.com" }]
requires-python = ">=3.11,<3.14"
dependencies = ["cryptography>=42.0.0,<51.0.0"]
keywords = [
    "iot",
    "esp32",
    "arduino",
    "protocol",
    "encryption",
    "aes-gcm",
    "embedded",
    "udp",
    "tcp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Networking",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://usmp.metaloom.in"
Repository = "https://github.com/metaloomlabs/usmp"
Documentation = "https://usmp.metaloom.in/docs"
"Bug Tracker" = "https://github.com/metaloomlabs/usmp/issues"


[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "usmp"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0", "ruff>=0.3.0", "mypy>=1.9.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "C90", "S", "BLE", "RUF"]
ignore = ["E501", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 32

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    "SLF001",
    "ANN",
    "BLE001",
    "S110",
    "B017",
    "RUF059",
    "S603",
    "S607",
    "UP015",
    "S104",
    "UP022",
]


[tool.mypy]
python_version = "3.11"
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src", "tests"]
