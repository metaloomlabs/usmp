[env:esp32]
platform  = espressif32
board     = esp32dev
framework = arduino

; ── DXP library ───────────────────────────────────────────────────────────────
lib_deps =
    symlink://../ports/dxp-arduino   ; local dev — symlink to repo

; For release (once published to PlatformIO registry):
;   lib_deps = opsid-io/DXP @ ^0.2.0

; ── Build flags ───────────────────────────────────────────────────────────────
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

; ── Serial monitor ────────────────────────────────────────────────────────────
monitor_speed = 115200
monitor_filters = esp32_exception_decoder